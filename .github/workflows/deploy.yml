name: OptiPlan 360 CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: optiplan360

jobs:
  # =============================================================================
  # Test Job
  # =============================================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["20"]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optiplan360_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    # Setup Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    # Setup Node
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    # Cache pip dependencies
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    # Install Python dependencies
    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    
    # Run Python linting
    - name: Run Python linting
      working-directory: ./backend
      run: |
        poetry run flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        poetry run black --check app tests
        poetry run isort --check-only app tests
    
    # Run Python tests
    - name: Run Python tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optiplan360_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: "true"
      run: |
        poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=html -n auto
    
    # Upload Python coverage
    - name: Upload Python coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
    
    # Install Node dependencies
    - name: Install Node dependencies
      working-directory: ./frontend
      run: npm ci
    
    # Run frontend linting
    - name: Run frontend linting
      working-directory: ./frontend
      run: |
        npm run lint
        npm run typecheck
    
    # Run frontend tests
    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test:ci
    
    # Run Playwright E2E tests
    - name: Install Playwright
      working-directory: ./frontend
      run: npx playwright install --with-deps
    
    - name: Run E2E tests
      working-directory: ./frontend
      run: npx playwright test
    
    # Upload frontend coverage
    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend
        name: frontend-coverage

  # =============================================================================
  # Security Scan
  # =============================================================================
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Python security scan
    - name: Run Bandit (Python security)
      working-directory: ./backend
      run: |
        pip install bandit
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -ll
    
    # Upload security report
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: backend/bandit-report.json
    
    # NPM audit
    - name: Run NPM audit
      working-directory: ./frontend
      run: npm audit --audit-level=moderate

  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        component: [backend, frontend, ai-worker, background-worker]
    
    steps:
    - uses: actions/checkout@v4
    
    # Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # Login to Container Registry
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # Extract metadata
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    # Determine target stage
    - name: Determine target
      id: target
      run: |
        case "${{ matrix.component }}" in
          backend)
            echo "target=production" >> $GITHUB_OUTPUT
            echo "file=./Dockerfile.production" >> $GITHUB_OUTPUT
            ;;
          frontend)
            echo "target=frontend-production" >> $GITHUB_OUTPUT
            echo "file=./Dockerfile.production" >> $GITHUB_OUTPUT
            ;;
          ai-worker)
            echo "target=ai-worker" >> $GITHUB_OUTPUT
            echo "file=./Dockerfile.production" >> $GITHUB_OUTPUT
            ;;
          background-worker)
            echo "target=background-worker" >> $GITHUB_OUTPUT
            echo "file=./Dockerfile.production" >> $GITHUB_OUTPUT
            ;;
        esac
    
    # Build and push
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ steps.target.outputs.file }}
        target: ${{ steps.target.outputs.target }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  # =============================================================================
  # Deploy to Staging
  # =============================================================================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    # Setup kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    # Setup Kustomize
    - name: Setup Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
    
    # Configure kubectl
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    # Update image tags
    - name: Update image tags
      run: |
        cd k8s/overlays/staging
        kustomize edit set image backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
    
    # Deploy to staging
    - name: Deploy to staging
      run: |
        export KUBECONFIG=kubeconfig
        kustomize build k8s/overlays/staging | kubectl apply -f -
        kubectl rollout status deployment/backend-api -n optiplan360 --timeout=300s
        kubectl rollout status deployment/frontend -n optiplan360 --timeout=300s

  # =============================================================================
  # Deploy to Production
  # =============================================================================
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    # Setup kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
    
    # Setup Kustomize
    - name: Setup Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
    
    # Configure kubectl
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    # Update image tags with release version
    - name: Update image tags
      run: |
        cd k8s/overlays/production
        kustomize edit set image backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}
        kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
    
    # Deploy to production (blue-green strategy)
    - name: Deploy to production
      run: |
        export KUBECONFIG=kubeconfig
        
        # Apply new configuration
        kustomize build k8s/overlays/production | kubectl apply -f -
        
        # Wait for rollout
        kubectl rollout status deployment/backend-api -n optiplan360 --timeout=600s
        kubectl rollout status deployment/frontend -n optiplan360 --timeout=600s
    
    # Run smoke tests
    - name: Run smoke tests
      run: |
        curl -sf https://api.optiplan360.com/api/v1/health || exit 1
        curl -sf https://optiplan360.com || exit 1
    
    # Create GitHub Release
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

  # =============================================================================
  # Database Migration
  # =============================================================================
  migrate-database:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    # Install dependencies
    - name: Install dependencies
      working-directory: ./backend
      run: |
        pip install poetry
        poetry install
    
    # Run migrations
    - name: Run database migrations
      working-directory: ./backend
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
      run: |
        poetry run alembic upgrade head

  # =============================================================================
  # Notify
  # =============================================================================
  notify:
    needs: [deploy-production, migrate-database]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Slack - Success
      if: needs.deploy-production.result == 'success' && needs.migrate-database.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "✅ OptiPlan 360 ${{ github.ref_name }} deployed to production successfully!"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Notify Slack - Failure
      if: needs.deploy-production.result == 'failure' || needs.migrate-database.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "❌ OptiPlan 360 ${{ github.ref_name }} deployment failed!"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
