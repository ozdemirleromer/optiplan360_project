name: Workflow Contract Gates
description: Install dependencies and run workflow contract gates in fixed order.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20'
  python-version:
    description: Python version
    required: false
    default: '3.11'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install frontend dependencies
      shell: bash
      run: |
        cd frontend
        npm ci

    - name: Install backend dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: Run workflow contract gates
      shell: bash
      run: |
        npm run test:workflow-contract-gates
