# AI/ML Dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: optiplan360-ai-ml
  namespace: monitoring
spec:
  folder: "OptiPlan 360"
  json: >
    {
      "title": "OptiPlan 360 - AI/ML Metrics",
      "uid": "optiplan360-ai",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Inference Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(optiplan360_ai_inference_requests_total[5m]))",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Inference Latency (p95)",
          "type": "stat",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(optiplan360_ai_inference_duration_seconds_bucket[5m])) by (le))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}
        },
        {
          "id": 3,
          "title": "GPU Memory Usage",
          "type": "gauge",
          "targets": [
            {
              "expr": "optiplan360_ai_gpu_memory_usage_bytes / 1024 / 1024 / 1024",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "max": 17179869184,
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 12884901888},
                  {"color": "red", "value": 15032385536}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 4,
          "title": "Inference Rate by Model",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(optiplan360_ai_inference_requests_total[5m])) by (model_type)",
              "legendFormat": "{{model_type}}",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}
        },
        {
          "id": 5,
          "title": "Inference Latency Distribution",
          "type": "heatmap",
          "targets": [
            {
              "expr": "sum(rate(optiplan360_ai_inference_duration_seconds_bucket[5m])) by (le)",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}
        },
        {
          "id": 6,
          "title": "Model Load Duration",
          "type": "table",
          "targets": [
            {
              "expr": "avg(optiplan360_ai_model_load_duration_seconds) by (model_name)",
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "model_name": "Model",
                  "Value": "Load Time (s)"
                }
              }
            }
          ],
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 12}
        }
      ],
      "tags": ["optiplan360", "ai", "ml"]
    }

