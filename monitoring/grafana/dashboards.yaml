# OptiPlan 360 - Grafana Dashboard Configurations
# Prometheus data source ile dashboard tanımları

apiVersion: 1

providers:
  - name: 'OptiPlan 360 Dashboards'
    orgId: 1
    folder: 'OptiPlan 360'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

---
