# Alert Rules ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: optiplan360-alert-rules
  namespace: monitoring
  labels:
    app: optiplan360
    component: alerting
data:
  optiplan360-alerts.yml: |
    groups:
      - name: optiplan360-critical
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(optiplan360_http_requests_total{status=~"5.."}[5m])) 
              / sum(rate(optiplan360_http_requests_total[5m])) > 0.1
            for: 2m
            labels:
              severity: critical
              team: backend
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 10% for more than 2 minutes"
          
          - alert: ServiceDown
            expr: up{job="optiplan360-api"} == 0
            for: 1m
            labels:
              severity: critical
              team: backend
            annotations:
              summary: "OptiPlan 360 API is down"
              description: "The API has been down for more than 1 minute"
          
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, 
                sum(rate(optiplan360_http_request_duration_seconds_bucket[5m])) by (le)
              ) > 2
            for: 5m
            labels:
              severity: warning
              team: backend
            annotations:
              summary: "High latency detected"
              description: "95th percentile latency is above 2 seconds"
          
          - alert: DatabaseConnectionsHigh
            expr: optiplan360_db_connections_active / optiplan360_db_connections_total > 0.8
            for: 5m
            labels:
              severity: warning
              team: backend
            annotations:
              summary: "Database connection pool almost exhausted"
              description: "More than 80% of database connections are in use"
          
          - alert: LowCacheHitRate
            expr: |
              rate(optiplan360_cache_hits_total[5m]) 
              / (rate(optiplan360_cache_hits_total[5m]) + rate(optiplan360_cache_misses_total[5m])) < 0.5
            for: 10m
            labels:
              severity: warning
              team: backend
            annotations:
              summary: "Low cache hit rate"
              description: "Cache hit rate has dropped below 50%"
          
          - alert: ExportFailureRateHigh
            expr: |
              sum(rate(optiplan360_exports_total{status="failed"}[1h])) 
              / sum(rate(optiplan360_exports_total[1h])) > 0.1
            for: 5m
            labels:
              severity: warning
              team: backend
            annotations:
              summary: "High export failure rate"
              description: "More than 10% of exports are failing"
          
          - alert: AIInferenceLatencyHigh
            expr: |
              histogram_quantile(0.95, 
                sum(rate(optiplan360_ai_inference_duration_seconds_bucket[5m])) by (le)
              ) > 10
            for: 5m
            labels:
              severity: warning
              team: ml
            annotations:
              summary: "AI inference latency is high"
              description: "95th percentile inference time is above 10 seconds"
          
          - alert: GPUMemoryHigh
            expr: optiplan360_ai_gpu_memory_usage_bytes / 1024 / 1024 / 1024 > 14
            for: 5m
            labels:
              severity: warning
              team: ml
            annotations:
              summary: "GPU memory usage is high"
              description: "GPU memory usage is above 14 GB"
      
      - name: optiplan360-infrastructure
        interval: 1m
        rules:
          - alert: HighCPUUsage
            expr: process_cpu_percent > 80
            for: 10m
            labels:
              severity: warning
              team: devops
            annotations:
              summary: "High CPU usage"
              description: "CPU usage has been above 80% for 10 minutes"
          
          - alert: HighMemoryUsage
            expr: process_memory_percent > 85
            for: 10m
            labels:
              severity: warning
              team: devops
            annotations:
              summary: "High memory usage"
              description: "Memory usage has been above 85% for 10 minutes"
          
          - alert: DiskSpaceLow
            expr: disk_usage_percent > 90
            for: 5m
            labels:
              severity: critical
              team: devops
            annotations:
              summary: "Low disk space"
              description: "Disk usage is above 90%"
          
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total[10m]) > 0
            for: 5m
            labels:
              severity: critical
              team: devops
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ $labels.pod }} is restarting frequently"
